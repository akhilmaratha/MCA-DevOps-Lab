
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MCA Selenium Login Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .login-box {
      background: white;
      padding: 35px;
      border-radius: 10px;
      width: 320px;
      box-shadow: 0 4px 15px #0002;
    }
    h2 { text-align: center; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
    }
    #message {
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Student Login</h2>
    <form id="loginForm">
      <input id="username"
             placeholder="Username" required>
      <input id="password" type="password"
             placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <p id="message" role="status"></p>
  </div>

  <script>
    document.getElementById("loginForm")
      .addEventListener("submit", function(e) {
        e.preventDefault();

        const username =
          document.getElementById("username").value;
        const password =
          document.getElementById("password").value;
        const message =
          document.getElementById("message");

        if (username === "student" &&
            password === "Password123") {
          message.textContent = "Login Successful";
          message.style.color = "green";
        } else {
          message.textContent =
            "Invalid username or password";
          message.style.color = "red";
        }
      });
  </script>
</body>
</html>
